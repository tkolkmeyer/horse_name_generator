<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Horse Name Generator</title>
    <link type="image/png" sizes="32x32" rel="icon" href=".../icons8-trotting horse-ios_filled-32.png">
    <link rel="stylesheet" type="text/css" href="styles.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Rye&display=swap" rel="stylesheet">
    <script src="default.js"></script>
    <script src="generator.js"></script>
</head>

<body>
<!-- Horizontal Navigation -->

<nav class="horizontal-navigation">
</nav>

<!-- Title -->

    <header>
        <h1><span>Horse</span><span>Name</span><span>Generator</span></h1>
    </header>
    <div class="logo">
        <img onmouseover="spinLogo(this)" src="horse.jpeg" height="60" width="60" alt="Horse logo" />
    </div>
    <main>
        <div id="name-generator-button">
            <form class="home-page-title">
                <button id="formSubmit" class="submit-button">Generate</button>
            </form>
        </div>
        <p class="name display space" id="name-display-space"></p>
    </main>



</body>

</html>
